<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" id="prism-color-scheme" />
    <title>Prism — Dual-Engine Tab Organizer</title>
    <style>
      :root {
        color-scheme: dark;
        --prism-bg: #090A0F;
      }
      :root.light, [data-theme='pure-light'] {
        color-scheme: light;
        --prism-bg: #F8FAFC;
      }
      html {
        margin: 0 !important;
        padding: 0 !important;
        width: 392px !important;
        height: 440px !important;
        overflow: hidden !important;
        background-color: var(--prism-bg, #090A0F) !important;
        color-scheme: dark !important;
        outline: none !important;
        border: none !important;
        box-sizing: border-box !important;
      }
      html.light {
        color-scheme: light !important;
        background-color: #F8FAFC !important;
      }
      body {
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        height: 100% !important;
        overflow: hidden !important;
        background-color: var(--prism-bg, #090A0F) !important;
        color-scheme: dark !important;
        outline: none !important;
        border: none !important;
        box-sizing: border-box !important;
      }
      html.light body {
        color-scheme: light !important;
        background-color: #F8FAFC !important;
      }
      #root {
        width: 100% !important;
        height: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden !important;
        background-color: var(--prism-bg, #090A0F) !important;
        outline: none !important;
        border: none !important;
        box-sizing: border-box !important;
      }
      html.light #root {
        background-color: #F8FAFC !important;
      }
    </style>
  </head>
  <body class="bg-prism-bg antialiased selection:bg-indigo-500/30 selection:text-indigo-200">
    <div id="root"></div>
    <script type="module" src="/src/ui/main.tsx"></script>
  </body>
</html>
