<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="prismBody" x1="20" y1="20" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#94A3B8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#475569" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="spectrum1" x1="64" y1="54" x2="120" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="spectrum2" x1="64" y1="64" x2="122" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="spectrum3" x1="64" y1="74" x2="120" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="#090A0F"/>
  <!-- Incoming white light beam -->
  <path d="M8 68L46 58" stroke="#F8FAFC" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  <!-- Refracted spectral beams -->
  <path d="M78 52L118 36" stroke="url(#spectrum1)" stroke-width="5" stroke-linecap="round"/>
  <path d="M82 63L120 63" stroke="url(#spectrum2)" stroke-width="5" stroke-linecap="round"/>
  <path d="M85 74L118 90" stroke="url(#spectrum3)" stroke-width="5" stroke-linecap="round"/>
  <!-- Prism triangle -->
  <polygon points="64,22 24,98 104,98" fill="url(#prismBody)" stroke="#E2E8F0" stroke-width="3" stroke-linejoin="round"/>
</svg>
